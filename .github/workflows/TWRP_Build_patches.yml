name: TWRP Build patches

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-12.1
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Arata-Labs/device_xiaomi_surya-recovery'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/surya'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'surya'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'
        type: choice
        options:
        - recovery
        - boot
        - vendorboot
      APPLYPATCH:
        description: 'Apply diff.patch?'
        required: true
        default: 'yes'
        type: choice
        options: [yes, no]
      UPLOAD:
        description: 'Upload to Telegram Bot?'
        required: true
        default: 'yes'
        type: choice
        options: [yes, no]
      PUBLISH:
        description: 'Publish to GitHub Release?'
        required: true
        default: 'yes'
        type: choice
        options: [yes, no]

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-20.04
    permissions:
      contents: write

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        set -euxo pipefail
        sudo apt update
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev \
          x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool \
          squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python curl zip

    - name: Install OpenJDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Force python -> python3 (twrp-12.1)
      run: |
        sudo rm -f /usr/bin/python || true
        sudo ln -s /usr/bin/python3 /usr/bin/python

    - name: Enable ccache
      run: |
        echo 'export USE_CCACHE=1' >> $GITHUB_ENV
        echo 'export CCACHE_DIR=$HOME/.ccache' >> $GITHUB_ENV
        echo 'export CCACHE_EXEC=$(which ccache)' >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ github.ref }}-
          ccache-${{ runner.os }}-

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: ws
      run: |
        set -eux
        mkdir -p twrp
        cd twrp
        echo "wsdir=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "brigudav"
        git config --global user.email "alexvl1972@hotmail.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Repo sync
      working-directory: ${{ steps.ws.outputs.wsdir }}
      run: |
        repo sync -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags

    - name: Repopick patches
      working-directory: ${{ steps.ws.outputs.wsdir }}
      run: |
        source build/envsetup.sh
        repopick 7203

    - name: Clone device tree
      working-directory: ${{ steps.ws.outputs.wsdir }}
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

    - name: Apply custom diff.patch
      if: ${{ github.event.inputs.APPLYPATCH == 'yes' }}
      working-directory: ${{ steps.ws.outputs.wsdir }}
      run: |
        set -eux
        if [ -d "${{ github.event.inputs.DEVICE_PATH }}/patches" ]; then
          . "${{ github.event.inputs.DEVICE_PATH }}/patches/apply-patches.sh"
        else
          echo "No /patches directory in device tree; skipping."
        fi

    - name: Set swap space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build ${{ github.event.inputs.BUILD_TARGET }}image
      working-directory: ${{ steps.ws.outputs.wsdir }}
      run: |
        set -eux
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }}image -j"$(nproc --all)"

    - name: Set variables
      id: var
      run: |
        echo "DATE=$(date -u +%Y%m%d-%H%M)" >> $GITHUB_ENV
        echo "OUTDIR=${GITHUB_WORKSPACE}/twrp/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        echo "ZIP_NAME=twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ env.DATE }}.zip" >> $GITHUB_ENV

    - name: Pack image into zip
      working-directory: ${{ env.OUTDIR }}
      run: |
        set -eux
        zip -9 "${ZIP_NAME}" "${{ github.event.inputs.BUILD_TARGET }}.img"

    - name: Upload to Telegram Bot
      if: ${{ github.event.inputs.UPLOAD == 'yes' }}
      env:
        CHAT_ID: ${{ secrets.TELEGRAM_TO }}
        BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      working-directory: ${{ env.OUTDIR }}
      run: |
        set -eux
        curl -fsSL "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
          -F chat_id="${CHAT_ID}" \
          -F disable_notification=true \
          -F parse_mode=HTML \
          -F caption="<b>Build for <i>${{ github.event.inputs.DEVICE_NAME }}</i> completed.</b>\nBranch: <code>${{ github.event.inputs.MANIFEST_BRANCH }}</code>\nTarget: <code>${{ github.event.inputs.BUILD_TARGET }}</code>" \
          -F document=@"${ZIP_NAME}"

    - name: Publish to GitHub Release
      if: ${{ github.event.inputs.PUBLISH == 'yes' }}
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.OUTDIR }}/${{ env.ZIP_NAME }}
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} - Build ${{ env.DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.TEST }}